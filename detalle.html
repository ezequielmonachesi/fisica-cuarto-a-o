
<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Museo Digital de Física 2026 | Detalle</title>
  <meta name="description" content="Física en acción. Muestra pedagógica de los estudiantes de 4.º año del Colegio Reina de la Esperanza.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">

  <style>
    :root {
      --azul: #2563eb;
      --oscuro: #0f172a;
      --gris: #64748b;
      --fondo: #f8fafc;
    }

    body {
      background: var(--fondo);
      color: var(--oscuro);
    }

    .navbar {
      background: white;
      box-shadow: 0 2px 15px rgba(0,0,0,.05);
    }

    .detalle-hero {
      background: linear-gradient(135deg,#0f172a,#1e40af);
      color: white;
      padding: 65px 0;
      border-radius: 0 0 35px 35px;
    }

    .detalle-hero h1 {
      font-size: clamp(2.2rem,5vw,3.8rem);
      font-weight: 800;
      letter-spacing: -1px;
    }

    .etiqueta {
      display: inline-block;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--azul);
      margin-bottom: 12px;
    }

    .detalle-hero .etiqueta {
      color: #bfdbfe;
    }

    .portada-proyecto {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,.1);
    }

    .bloque {
      background: white;
      padding: 35px;
      border-radius: 22px;
      margin-bottom: 25px;
      box-shadow: 0 6px 25px rgba(15,23,42,.04);
    }

    .bloque h2 {
      font-weight: 800;
      font-size: 1.65rem;
      margin-bottom: 20px;
    }

    .bloque h3 {
      font-weight: 700;
      font-size: 1.15rem;
      margin-top: 25px;
    }

    .bloque p, .bloque li {
      color: #475569;
      line-height: 1.9;
    }

    .bloque li {
      margin-bottom: 7px;
    }

    .integrante {
      background: #eff6ff;
      border-radius: 14px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 100%;
      font-weight: 600;
    }

    .integrante i {
      color: var(--azul);
      font-size: 1.4rem;
    }

    .concepto {
      background: #eff6ff;
      border-left: 4px solid var(--azul);
      padding: 13px 18px;
      border-radius: 8px;
      height: 100%;
      font-weight: 500;
    }

    .formula {
      background: #eff6ff;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      color: #1e40af;
      font-size: 1.6rem;
      font-weight: 800;
      margin: 25px 0;
    }

    .gallery-img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 15px;
      cursor: pointer;
      transition: transform .3s;
    }

    .gallery-img:hover {
      transform: scale(1.03);
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #0f172a;
      border-radius: 16px;
      overflow: hidden;
    }

    .video-box iframe,
    .video-box video {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .archivo-card {
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 24px;
      background: #fff;
    }

    .archivo-icono {
      font-size: 2.7rem;
      color: #dc2626;
    }

    .conclusion {
      background: #eff6ff;
      border-left: 5px solid var(--azul);
      padding: 25px;
      border-radius: 15px;
      color: #1e3a8a;
      line-height: 1.9;
    }

    .vacio {
      padding: 30px;
      background: #f1f5f9;
      border-radius: 15px;
      color: var(--gris);
      text-align: center;
    }

    .modal-image {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    footer {
      background: var(--oscuro);
      color: #cbd5e1;
    }

    @media(max-width:768px) {
      .bloque {
        padding: 23px;
      }

      .detalle-hero {
        padding: 45px 0;
      }

      .gallery-img {
        height: 190px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVEGACIÓN -->
  <nav class="navbar sticky-top">
    <div class="container py-2">

      <a href="index.html" class="navbar-brand fw-bold">
        <i class="bi bi-lightning-charge-fill text-primary"></i>
        Física 4.º Año
      </a>

      <a href="index.html#proyectos"
         class="btn btn-outline-primary btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left"></i>
        Volver
      </a>

    </div>
  </nav>

  <!-- ENCABEZADO -->
  <header class="detalle-hero">
    <div class="container" id="encabezado"></div>
  </header>

  <!-- CONTENIDO -->
  <main class="container py-5">

    <div id="contenidoProyecto"></div>

    <div class="text-center mt-5">
      <a href="index.html#proyectos"
         class="btn btn-primary rounded-pill px-4 py-3">
        <i class="bi bi-arrow-left me-2"></i>
        Explorar otros proyectos
      </a>
    </div>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="py-5">
    <div class="container text-center">

      <h5 class="fw-bold text-white">
        Física en acción · 2026
      </h5>

      <p class="mb-1">
        Muestra Pedagógica Institucional
      </p>

      <p class="mb-1">
        Colegio Reina de la Esperanza · El Manantial
      </p>

      <p class="mb-0">
        Profesora Silvina Coronel
      </p>

    </div>
  </footer>

  <!-- VISOR DE FOTOGRAFÍAS -->
  <div class="modal fade" id="visor" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content bg-dark">

        <div class="modal-header border-0">
          <button type="button"
                  class="btn-close btn-close-white"
                  data-bs-dismiss="modal"
                  aria-label="Cerrar">
          </button>
        </div>

        <div class="modal-body text-center">
          <img id="imagen-ampliada"
               class="modal-image"
               alt="Fotografía del proyecto">
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="proyectos.js"></script>

  <script>
    // =========================================
    // CONTENIDO EDUCATIVO
    // Preparado para los cuatro proyectos
    // =========================================

    const contenidos = {

      "hidraulica": {
        area: "Energía y sus transformaciones",

        introduccion: [
          "La energía hidráulica es la energía que posee el agua debido a su movimiento o a su altura. Es aprovechada por el ser humano para producir energía eléctrica mediante centrales hidroeléctricas.",
          "Este tipo de aprovechamiento energético demuestra cómo una fuente natural puede transformarse en energía útil para nuestras actividades cotidianas."
        ],

        conceptos: [
          "Energía potencial gravitatoria",
          "Energía cinética",
          "Transformación y conservación de la energía",
          "Movimiento del agua",
          "Transformación de energía mecánica en eléctrica"
        ],

        explicacion: [
          "Cuando el agua se encuentra almacenada a cierta altura, posee energía potencial gravitatoria.",
          "Al descender, esa energía se transforma en energía cinética, porque el agua adquiere movimiento.",
          "El movimiento del agua puede hacer girar una turbina conectada a un generador eléctrico. El generador transforma la energía mecánica de rotación en energía eléctrica."
        ],

        formula: "Energía potencial → Cinética → Mecánica → Eléctrica",

        aplicaciones: [
          "Centrales hidroeléctricas",
          "Represas",
          "Sistemas de aprovechamiento de corrientes de agua",
          "Producción de electricidad para hogares e industrias"
        ],

        demuestra: "Que la energía puede transformarse de una forma a otra y que el movimiento del agua puede aprovecharse para realizar trabajo y producir electricidad.",

        conclusion: "A través de este proyecto comprendimos que el agua puede ser utilizada como fuente de energía renovable. También reconocimos la importancia de las transformaciones energéticas y su aplicación en la producción de electricidad."
      },

      "leyes-newton": {
        area: "Fuerzas y movimiento",

        introduccion: [
          "Las leyes de Newton son tres principios fundamentales de la Física clásica que permiten explicar cómo las fuerzas afectan el movimiento de los cuerpos.",
          "Fueron formuladas por Isaac Newton y constituyen una base fundamental para comprender fenómenos cotidianos, desde el desplazamiento de un automóvil hasta el movimiento de un cohete."
        ],

        conceptos: [
          "Fuerza",
          "Inercia",
          "Masa",
          "Aceleración",
          "Acción y reacción",
          "Interacción entre cuerpos"
        ],

        explicacion: [
          "Primera ley: Ley de inercia. Un cuerpo permanece en reposo o en movimiento rectilíneo uniforme mientras la fuerza resultante sobre él sea cero. Por ejemplo, cuando un colectivo frena bruscamente, los pasajeros tienden a desplazarse hacia adelante.",
          "Segunda ley: Ley fundamental de la dinámica. La aceleración de un cuerpo depende de la fuerza resultante aplicada y de su masa. Si aplicamos una misma fuerza a dos objetos de distinta masa, el de menor masa tendrá mayor aceleración.",
          "Tercera ley: Acción y reacción. Cuando un cuerpo ejerce una fuerza sobre otro, este ejerce simultáneamente una fuerza de igual intensidad y dirección, pero de sentido contrario. Por ejemplo, un globo se desplaza cuando el aire sale en sentido contrario."
        ],

        formula: "F = m × a",

        aplicaciones: [
          "Automóviles y medios de transporte",
          "Deportes",
          "Cohetes y propulsión",
          "Caída y desplazamiento de objetos",
          "Actividades cotidianas"
        ],

        demuestra: "Que las fuerzas son responsables de modificar el estado de movimiento de los cuerpos y que las leyes de Newton permiten explicar y predecir estos comportamientos.",

        conclusion: "Aprendimos que el movimiento de los cuerpos está relacionado con las fuerzas que actúan sobre ellos. Mediante las tres leyes de Newton podemos explicar diferentes situaciones de la vida cotidiana y comprender cómo interactúan los objetos."
      },

      "fuerza-movimiento": {
        area: "Mecánica clásica",

        introduccion: [
          "El movimiento es un fenómeno físico que ocurre cuando un cuerpo cambia su posición respecto de un sistema de referencia a medida que transcurre el tiempo.",
          "Las fuerzas pueden modificar el movimiento de los cuerpos, provocando cambios en su velocidad, dirección o estado de reposo."
        ],

        conceptos: [
          "Movimiento y reposo",
          "Sistema de referencia",
          "Trayectoria",
          "Distancia y desplazamiento",
          "Velocidad",
          "Aceleración",
          "Fuerza aplicada",
          "Rozamiento"
        ],

        explicacion: [
          "Cuando aplicamos una fuerza sobre un objeto, podemos modificar su estado de movimiento.",
          "Si empujamos una pelota en reposo, podemos ponerla en movimiento. Si empujamos un carrito, podemos aumentar su velocidad. Si aplicamos una fuerza en sentido contrario, podemos disminuirla.",
          "El rozamiento es una fuerza que aparece cuando dos superficies están en contacto y se opone al movimiento relativo o a su tendencia. Por ejemplo, una pelota que rueda por el suelo termina deteniéndose debido, entre otros factores, al rozamiento."
        ],

        formula: "F = m × a",

        aplicaciones: [
          "Bicicletas",
          "Automóviles",
          "Pelotas en movimiento",
          "Ascensores",
          "Juegos mecánicos",
          "Máquinas y herramientas"
        ],

        demuestra: "Que el movimiento puede estudiarse y explicarse mediante magnitudes físicas y que las fuerzas intervienen en los cambios que experimentan los cuerpos.",

        conclusion: "Mediante este proyecto comprendimos que el movimiento no depende solamente de que un objeto se desplace, sino también de las fuerzas que actúan sobre él. Aprendimos a relacionar fuerza, masa, velocidad y aceleración con situaciones cotidianas."
      },

      "energia-electrica-luminica": {
        area: "Electricidad y energía",

        introduccion: [
          "La energía eléctrica es una forma de energía asociada a la presencia y al movimiento de cargas eléctricas.",
          "La energía lumínica o luminosa es la energía que transporta la luz, una forma de radiación electromagnética que nos permite observar los objetos.",
          "Mediante diferentes dispositivos, la energía eléctrica puede transformarse en energía luminosa."
        ],

        conceptos: [
          "Energía eléctrica",
          "Corriente eléctrica",
          "Circuitos eléctricos",
          "Conductores y aislantes",
          "Fuentes de energía",
          "Transformación de energía",
          "Luz y radiación electromagnética"
        ],

        explicacion: [
          "Un circuito eléctrico es un camino cerrado por el cual pueden circular cargas eléctricas.",
          "Para construir un circuito básico podemos utilizar una pila o batería, cables conductores, una lámpara o LED y un interruptor.",
          "Cuando el circuito está cerrado, la corriente eléctrica puede circular y alimentar el dispositivo luminoso.",
          "En el caso de un LED, la energía eléctrica se transforma principalmente en energía luminosa, aunque también se disipa una cantidad de energía térmica."
        ],

        formula: "Energía química → Eléctrica → Lumínica + Térmica",

        aplicaciones: [
          "Lámparas LED",
          "Linternas",
          "Semáforos",
          "Pantallas",
          "Alumbrado público",
          "Señalización luminosa"
        ],

        demuestra: "Que la energía eléctrica puede transformarse en otras formas de energía y que los circuitos eléctricos permiten controlar el funcionamiento de diferentes dispositivos.",

        conclusion: "A través de esta experiencia comprendimos cómo funciona un circuito eléctrico y cómo la energía eléctrica puede transformarse en energía luminosa. También reconocimos la importancia de la electricidad en nuestra vida cotidiana y la necesidad de utilizarla de manera responsable."
      }
    };


    // =========================================
    // FUNCIONES AUXILIARES
    // =========================================

    const parametros = new URLSearchParams(location.search);
    const id = parametros.get("id");

    const proyecto = typeof proyectos !== "undefined"
      ? proyectos.find(p => p.id === id)
      : null;

    const contenido = contenidos[id];

    const encabezado = document.getElementById("encabezado");
    const raiz = document.getElementById("contenidoProyecto");

    // Escapar texto al insertarlo en HTML
    function escapar(valor) {
      return String(valor ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[c]);
    }

    function parrafos(lista) {
      return (lista || [])
        .map(texto => `<p>${escapar(texto)}</p>`)
        .join("");
    }

    function listaHTML(lista) {
      return (lista || [])
        .map(texto => `<li>${escapar(texto)}</li>`)
        .join("");
    }

    function videoEmbed(url) {
      try {
        const u = new URL(url, location.href);
        const host = u.hostname.toLowerCase();
        let codigo = null;

        if (host === "youtu.be") {
          codigo = u.pathname.split("/")[1];
        } else if ([
          "youtube.com",
          "www.youtube.com",
          "m.youtube.com",
          "youtube-nocookie.com",
          "www.youtube-nocookie.com"
        ].includes(host)) {
          codigo = u.searchParams.get("v");

          if (!codigo &&
              (u.pathname.startsWith("/shorts/") ||
               u.pathname.startsWith("/embed/"))) {
            codigo = u.pathname.split("/")[2];
          }
        }

        if (codigo && /^[a-zA-Z0-9_-]{11}$/.test(codigo)) {
          return `https://www.youtube-nocookie.com/embed/${codigo}`;
        }
      } catch (error) {
        console.error(error);
      }

      return null;
    }


    // =========================================
    // MOSTRAR PROYECTO
    // =========================================

    if (!proyecto) {

      encabezado.innerHTML = `
        <h1>Proyecto no encontrado</h1>
      `;

      raiz.innerHTML = `
        <div class="vacio">
          Revisá el enlace o regresá a la muestra.
        </div>
      `;

    } else {

      document.title =
        `${proyecto.titulo} | Museo Digital de Física 2026`;

      const datos = contenido || {
        area: "Física",
        introduccion: [proyecto.descripcion],
        conceptos: [],
        explicacion: [proyecto.desarrollo],
        formula: "",
        aplicaciones: [],
        demuestra: "",
        conclusion: ""
      };

      // =====================================
      // ENCABEZADO
      // =====================================

      encabezado.innerHTML = `
        <span class="etiqueta">
          Física en acción · Muestra Pedagógica 2026
        </span>

        <h1>${escapar(proyecto.titulo)}</h1>

        <p class="lead mt-3 mb-4">
          ${escapar(proyecto.subtitulo)}
        </p>

        <div class="d-flex flex-wrap gap-3">
          <span>
            <i class="bi bi-mortarboard me-2"></i>
            4.º año
          </span>

          <span>
            <i class="bi bi-person-workspace me-2"></i>
            Profesora Silvina Coronel
          </span>

          <span>
            <i class="bi bi-building me-2"></i>
            Colegio Reina de la Esperanza
          </span>
        </div>
      `;


      // =====================================
      // INTEGRANTES
      // =====================================

      const integrantes = proyecto.integrantes || [];

      const seccionIntegrantes = integrantes.length ? `
        <section class="bloque">

          <span class="etiqueta">Nuestro equipo</span>

          <h2>Integrantes del proyecto</h2>

          <div class="row g-3">
            ${integrantes.map(nombre => `
              <div class="col-12 col-md-6 col-lg-4">
                <div class="integrante">
                  <i class="bi bi-person-circle"></i>
                  <span>${escapar(nombre)}</span>
                </div>
              </div>
            `).join("")}
          </div>

        </section>
      ` : "";


      // =====================================
      // CONCEPTOS
      // =====================================

      const seccionConceptos = datos.conceptos.length ? `
        <section class="bloque">

          <span class="etiqueta">Aprendizajes</span>

          <h2>¿Qué conceptos físicos aprendimos?</h2>

          <div class="row g-3">
            ${datos.conceptos.map(concepto => `
              <div class="col-md-6">
                <div class="concepto">
                  <i class="bi bi-check-circle-fill text-primary me-2"></i>
                  ${escapar(concepto)}
                </div>
              </div>
            `).join("")}
          </div>

        </section>
      ` : "";


      // =====================================
      // EXPLICACIÓN
      // =====================================

      const seccionExplicacion = `
        <section class="bloque">

          <span class="etiqueta">Explicación científica</span>

          <h2>¿Cómo funciona?</h2>

          ${parrafos(datos.explicacion)}

          ${datos.formula ? `
            <div class="formula">
              ${escapar(datos.formula)}
            </div>
          ` : ""}

        </section>
      `;


      // =====================================
      // APLICACIONES
      // =====================================

      const seccionAplicaciones = datos.aplicaciones.length ? `
        <section class="bloque">

          <span class="etiqueta">La física cotidiana</span>

          <h2>¿Dónde encontramos estas aplicaciones?</h2>

          <ul>
            ${listaHTML(datos.aplicaciones)}
          </ul>

        </section>
      ` : "";


      // =====================================
      // FOTOGRAFÍAS
      // =====================================

      const galeria = proyecto.galeria || [];

      const seccionFotos = `
        <section class="bloque">

          <span class="etiqueta">Registro de nuestro proyecto</span>

          <h2>Galería de fotografías</h2>

          <div class="row g-3">

            ${galeria.length ? galeria.map((src, i) => `
              <div class="col-12 col-sm-6 col-lg-4">

                <img
                  src="${escapar(src)}"
                  alt="Fotografía ${i + 1} del proyecto"
                  class="gallery-img"
                  loading="lazy"
                  data-foto="${i}">

              </div>
            `).join("") : `
              <div class="col-12">
                <div class="vacio">
                  Próximamente: fotografías del proyecto.
                </div>
              </div>
            `}

          </div>

        </section>
      `;


      // =====================================
      // VIDEOS
      // =====================================

      const videos = proyecto.videos || [];

      const seccionVideos = `
        <section class="bloque">

          <span class="etiqueta">Experiencias en acción</span>

          <h2>Video de la experiencia</h2>

          <div class="row g-4">

            ${videos.length ? videos.map(url => {
              const embed = videoEmbed(url);

              return `
                <div class="col-lg-6">

                  <div class="video-box">

                    ${embed ? `
                      <iframe
                        src="${escapar(embed)}"
                        title="Video del proyecto"
                        loading="lazy"
                        allowfullscreen>
                      </iframe>
                    ` : `
                      <video
                        src="${escapar(url)}"
                        controls
                        preload="metadata">
                      </video>
                    `}

                  </div>

                </div>
              `;
            }).join("") : `
              <div class="col-12">
                <div class="vacio">
                  Próximamente: video demostrativo.
                </div>
              </div>
            `}

          </div>

        </section>
      `;


      // =====================================
      // ARCHIVOS PDF
      // =====================================

      const archivos = proyecto.archivos || [];

      const seccionArchivos = `
        <section class="bloque">

          <span class="etiqueta">Material complementario</span>

          <h2>Trabajo escrito en PDF</h2>

          <p>
            Consultá el trabajo expositivo preparado
            por los estudiantes.
          </p>

          <div class="row g-3">

            ${archivos.length ? archivos.map(archivo => `
              <div class="col-lg-6">

                <div class="archivo-card h-100">

                  <div class="d-flex align-items-center gap-3 mb-4">

                    <i class="bi bi-file-earmark-pdf-fill archivo-icono"></i>

                    <div>
                      <h5 class="fw-bold mb-1">
                        ${escapar(archivo.nombre)}
                      </h5>

                      <small class="text-muted">
                        Documento PDF
                      </small>
                    </div>

                  </div>

                  <div class="d-flex flex-wrap gap-2">

                    <a
                      href="${escapar(archivo.ruta)}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="btn btn-outline-primary rounded-pill px-4">

                      <i class="bi bi-eye me-2"></i>
                      Ver PDF

                    </a>

                    <a
                      href="${escapar(archivo.ruta)}"
                      download
                      class="btn btn-primary rounded-pill px-4">

                      <i class="bi bi-download me-2"></i>
                      Descargar

                    </a>

                  </div>

                </div>

              </div>
            `).join("") : `
              <div class="col-12">
                <div class="vacio">
                  Próximamente: trabajo escrito en PDF.
                </div>
              </div>
            `}

          </div>

        </section>
      `;


      // =====================================
      // CONCLUSIÓN
      // =====================================

      const seccionConclusion = datos.conclusion ? `
        <section class="bloque">

          <span class="etiqueta">Reflexión final</span>

          <h2>Nuestra conclusión</h2>

          <div class="conclusion">
            <i class="bi bi-lightbulb-fill me-2"></i>
            ${escapar(datos.conclusion)}
          </div>

        </section>
      ` : "";


      // =====================================
      // RENDERIZADO COMPLETO
      // =====================================

      raiz.innerHTML = `

        <div class="mb-5">
          <img
            src="${escapar(proyecto.imagen)}"
            alt="${escapar(proyecto.titulo)}"
            class="portada-proyecto">
        </div>

        ${seccionIntegrantes}

        <section class="bloque">

          <span class="etiqueta">
            ${escapar(datos.area)}
          </span>

          <h2>¿De qué trata este proyecto?</h2>

          ${parrafos(datos.introduccion)}

        </section>

        ${seccionConceptos}

        ${seccionExplicacion}

        ${seccionAplicaciones}

        ${datos.demuestra ? `
          <section class="bloque">

            <span class="etiqueta">
              Lo que descubrimos
            </span>

            <h2>¿Qué nos demuestra este experimento?</h2>

            <p>${escapar(datos.demuestra)}</p>

          </section>
        ` : ""}

        ${seccionFotos}

        ${seccionVideos}

        ${seccionArchivos}

        ${seccionConclusion}

      `;


      // =====================================
      // VISOR DE FOTOGRAFÍAS
      // =====================================

      document.querySelectorAll("[data-foto]")
        .forEach(img => {

          img.addEventListener("click", () => {

            const indice = Number(img.dataset.foto);

            document.getElementById("imagen-ampliada").src =
              galeria[indice];

            bootstrap.Modal.getOrCreateInstance(
              document.getElementById("visor")
            ).show();

          });

        });

    }
  </script>

</body>
</html>
